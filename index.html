<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Telethon 2026 — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      thead.sticky { position: sticky; top: 0; z-index: 10; }
      /* Custom scrollbar for modern look */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const SHEET_ID = "1yHdj1almgPF4q_pPpSx7qZjfC1LoA6UChjit60_khfg";
      const SHEET_NAME = "AJMER DIVISION";
      const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

      const REFRESH_INTERVAL_MS = 2000;
      const UNIT_DIVISOR = 7000;

      function splitLines(text) {
        if (!text) return [];
        return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      }

      function parseCSVLine(line) {
        const result = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === "," && !inQuotes) {
            result.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }
        result.push(cur);
        return result;
      }

      function parseCSV(csvText) {
        if (!csvText) return [];
        if (csvText.charCodeAt(0) === 0xfeff) csvText = csvText.slice(1);
        const lines = splitLines(csvText).filter(l => l.trim() !== "");
        if (lines.length === 0) return [];
        const headers = parseCSVLine(lines[0]).map(h => (h || "").trim());
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          if (values.length === 0) continue;
          const obj = {};
          for (let j = 0; j < headers.length; j++) {
            const key = headers[j] || `col_${j}`;
            obj[key] = values[j] !== undefined ? values[j].trim() : "";
          }
          rows.push(obj);
        }
        return rows;
      }

      function firstMatchingValue(row, candidates) {
        for (const k of Object.keys(row)) {
          const lk = k.toLowerCase();
          for (const c of candidates) {
            if (lk === c.toLowerCase() || lk.includes(c.toLowerCase())) return row[k];
          }
        }
        return "";
      }

      function formatNumber(n) {
        if (typeof n !== "number" || !isFinite(n)) return "0";
        return n.toLocaleString();
      }
      
      const ImageGenerator = ({ data, title, captureRef }) => {
        const today = new Date();
        const formattedDate = `Date: ${today.toLocaleDateString('en-GB')} ${today.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
        
        const getRowClass = (index) => {
          if (index === 0) return "bg-amber-200 text-amber-900 font-bold";
          if (index === 1) return "bg-slate-200 text-slate-900 font-bold";
          if (index === 2) return "bg-orange-200 text-orange-900 font-bold";
          return index % 2 === 0 ? "bg-white" : "bg-gray-50";
        };

        return (
          <div ref={captureRef} className="w-[800px] p-8 font-sans" style={{ background: 'linear-gradient(135deg, #f5f7fa 0%, #e0e7ff 100%)'}}>
            <div className="text-center mb-8">
                <h1 className="text-4xl font-extrabold text-indigo-900 tracking-wider mb-2">TELETHONE 2026 RAJASTHAN STATE</h1>
                <h2 className="text-3xl font-semibold text-indigo-700 tracking-wider">{title}</h2>
            </div>
            <div className="mt-8 shadow-lg rounded-lg overflow-hidden">
              <table className="w-full text-left border-collapse">
                <thead className="bg-indigo-800 text-white">
                  <tr>
                    <th className="p-4 font-bold text-base">Rank</th>
                    <th className="p-4 font-bold text-base">Ustaz Name</th>
                    <th className="p-4 font-bold text-base">Jamia Name</th>
                    <th className="p-4 font-bold text-base text-right">Raqam</th>
                    <th className="p-4 font-bold text-base text-right">Unit</th>
                  </tr>
                </thead>
                <tbody>
                  {data.map((row, index) => (
                    <tr key={row.id} className={getRowClass(index)}>
                      <td className="p-3 font-bold text-center">{index + 1}</td>
                      <td className="p-3 uppercase font-medium">{row.ustaz}</td>
                      <td className="p-3 uppercase font-semibold">{row.jamia}</td>
                      <td className="p-3 text-right font-semibold">{formatNumber(row.raqam)}</td>
                      <td className="p-3 text-right font-bold">{row.unit.toFixed(1)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-8 flex justify-between items-center text-sm text-gray-700 font-medium">
              <span>Majlis Talimi Umoor India</span>
              <span>{formattedDate}</span>
            </div>
          </div>
        );
      };

      function App() {
        const [view, setView] = useState("Asatiza");
        const [rows, setRows] = useState([]);
        const [lastUpdated, setLastUpdated] = useState(null);
        const [searchTerm, setSearchTerm] = useState(""); // New search state
        
        const timerRef = useRef(null);
        const imageCaptureRef = useRef();
        const [imageRequest, setImageRequest] = useState(null);

        async function fetchData() {
          try {
            const res = await fetch(CSV_URL, { cache: "no-store" });
            if (!res.ok) throw new Error("Fetch failed: " + res.status);
            const text = await res.text();
            const parsed = parseCSV(text);
            setRows(parsed);
            setLastUpdated(new Date());
          } catch (err) {
            console.error("Fetch error:", err);
          }
        }

        useEffect(() => {
          fetchData();
          timerRef.current = setInterval(fetchData, REFRESH_INTERVAL_MS);
          return () => clearInterval(timerRef.current);
        }, []);
        
        useEffect(() => {
            if (imageRequest && imageCaptureRef.current) {
                html2canvas(imageCaptureRef.current, { useCORS: true, scale: 2 }).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = imageRequest.filename;
                    link.href = imgData;
                    link.click();
                    setImageRequest(null);
                });
            }
        }, [imageRequest]);

        const asatiza = rows.map((r, i) => {
          const rankRaw = firstMatchingValue(r, ["rank", "rnk"]) || "";
          const rankNum = parseInt((rankRaw + "").replace(/[^0-9]+/g, ""), 10);
          const rank = Number.isFinite(rankNum) && rankNum > 0 ? rankNum : null;
          const jamia = firstMatchingValue(r, ["jamia", "institute", "institution", "madarsa"]) || "";
          const ustaz = firstMatchingValue(r, ["ustaz", "ustad", "teacher", "name"]) || "";
          const raqamRaw = firstMatchingValue(r, ["raqam", "amount", "total"]) || "";
          const raqam = parseFloat((raqamRaw + "").replace(/[^0-9.-]+/g, "")) || 0;
          const unit = Number.isFinite(raqam) ? raqam / UNIT_DIVISOR : 0;
          return { id: `a-${i}`, rank, jamia, ustaz, raqam, unit };
        });

        const jamiaMap = {};
        asatiza.forEach(a => {
            if (!a.jamia) return; 
            const jamiaName = a.jamia.trim();
            const normalizedName = jamiaName.toLowerCase().replace(/\s+/g, ' ').trim();
            if (!normalizedName) return; 
            const amount = a.raqam;
            if (!jamiaMap[normalizedName]) {
                jamiaMap[normalizedName] = { jamia: jamiaName, totalAmount: 0, count: 0 };
            }
            jamiaMap[normalizedName].totalAmount += isNaN(amount) ? 0 : amount;
            jamiaMap[normalizedName].count += 1;
        });

        const jamiaData = Object.values(jamiaMap)
          .map((g, idx) => ({ id: `j-${idx}`, ...g, totalUnit: g.totalAmount / UNIT_DIVISOR }))
          .sort((a, b) => b.totalAmount - a.totalAmount);

        const sortedAsatizaByRaqam = [...asatiza].sort((a, b) => b.raqam - a.raqam);
        const topAsatizaIds = sortedAsatizaByRaqam.slice(0, 3).map(x => x.id);

        // Apply Search Filter
        const filteredAsatiza = sortedAsatizaByRaqam.filter(r => {
          if (!searchTerm) return true;
          const term = searchTerm.toLowerCase();
          return (
            (r.ustaz && r.ustaz.toLowerCase().includes(term)) ||
            (r.jamia && r.jamia.toLowerCase().includes(term))
          );
        });

        function topClass(pos) {
          if (pos === 0) return "bg-gradient-to-r from-amber-50 to-yellow-50 border-amber-200 shadow-sm";
          if (pos === 1) return "bg-gradient-to-r from-slate-50 to-gray-100 border-slate-300 shadow-sm";
          if (pos === 2) return "bg-gradient-to-r from-orange-50 to-orange-100 border-orange-200 shadow-sm";
          return "border-transparent";
        }

        function medal(pos) {
          if (pos === 0) return "🥇";
          if (pos === 1) return "🥈";
          if (pos === 2) return "🥉";
          return "";
        }
        
        const handleDownloadImage = (type) => {
          if (type === 'top5') {
            setImageRequest({
              data: sortedAsatizaByRaqam.slice(0, 5),
              title: "TOP 5 WINNERS",
              filename: 'telethon-top-5-winners.png'
            });
          } else if (type === 'full') {
            setImageRequest({
              data: sortedAsatizaByRaqam,
              title: "FULL LIST",
              filename: 'telethon-full-list.png'
            });
          }
        };

        return (
          <div>
            {imageRequest && (
                <div style={{ position: 'absolute', left: '-9999px', top: 0 }}>
                    <ImageGenerator data={imageRequest.data} title={imageRequest.title} captureRef={imageCaptureRef} />
                </div>
            )}
            
            <div className="p-4 md:p-8 max-w-7xl mx-auto">
                <header className="mb-8">
                  <div className="rounded-2xl p-6 bg-gradient-to-r from-indigo-600 to-purple-700 shadow-lg border-b border-indigo-800 text-center relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-full bg-white opacity-5"></div>
                      <h1 className="relative text-white font-extrabold tracking-widest text-2xl md:text-3xl drop-shadow-md">
                        TELETHONE 2026 RAJASTHAN STATE
                      </h1>
                  </div>
                </header>

                {/* Control Panel */}
                <div className="mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                  
                  {/* Left Controls (Tabs + Search) */}
                  <div className="flex flex-col sm:flex-row items-center flex-wrap gap-4 w-full md:w-auto">
                      <div className="inline-flex rounded-xl bg-slate-100 p-1">
                          <button onClick={() => setView("Asatiza")} className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === "Asatiza" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                            Asatiza
                          </button>
                          <button onClick={() => setView("Jamia")} className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === "Jamia" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                            Jamia
                          </button>
                      </div>

                      {/* Modern Search Bar */}
                      {view === 'Asatiza' && (
                          <div className="relative w-full sm:w-72">
                              <input
                                  type="text"
                                  placeholder="Teacher ya Jamia search karein..."
                                  value={searchTerm}
                                  onChange={(e) => setSearchTerm(e.target.value)}
                                  className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm outline-none text-sm text-slate-700 placeholder-slate-400"
                              />
                              <svg className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                              </svg>
                          </div>
                      )}
                  </div>

                  {/* Right Controls (Action Buttons & Status) */}
                  <div className="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                      {view === 'Asatiza' && (
                          <div className="flex items-center gap-2">
                              <button onClick={() => handleDownloadImage('top5')} disabled={!!imageRequest} className="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition-colors disabled:opacity-50">
                                  {imageRequest ? 'Generating...' : '↓ Top 5 (Img)'}
                              </button>
                              <button onClick={() => handleDownloadImage('full')} disabled={!!imageRequest} className="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 transition-colors disabled:opacity-50">
                                  {imageRequest ? 'Generating...' : '↓ Full List (Img)'}
                              </button>
                          </div>
                      )}
                      <div className="text-xs text-slate-400 text-right">
                        Auto-refresh: {REFRESH_INTERVAL_MS / 1000}s<br/>
                        <span className="font-medium text-slate-500">Last: {lastUpdated ? lastUpdated.toLocaleTimeString() : "—"}</span>
                      </div>
                  </div>
                </div>

                {/* Asatiza View */}
                {view === "Asatiza" ? (
                <section>
                    <div className="hidden md:block bg-white shadow-sm border border-slate-100 rounded-2xl overflow-hidden">
                      <table className="min-w-full table-auto border-collapse">
                          <thead className="sticky top-0 bg-slate-50 border-b border-slate-100">
                          <tr className="text-left">
                              <th className="py-4 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider">Rank</th>
                              <th className="py-4 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider">Ustaz Name</th>
                              <th className="py-4 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider">Jamia Name</th>
                              <th className="py-4 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Raqam</th>
                              <th className="py-4 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Unit</th>
                          </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                          {filteredAsatiza.map((r, idx) => {
                              // Use actual rank based on sorted global array to maintain accurate medals even when filtered
                              const actualRankIndex = sortedAsatizaByRaqam.findIndex(item => item.id === r.id);
                              const pos = topAsatizaIds.indexOf(r.id);
                              const tc = topClass(pos);
                              const raqamColor = pos === 0 ? "text-emerald-600 font-bold" : pos === 1 ? "text-sky-600 font-bold" : pos === 2 ? "text-amber-600 font-bold" : "text-slate-700 font-medium";
                              
                              return (
                              <tr key={r.id} className={`${tc} hover:bg-slate-50 transition-colors ${pos !== -1 ? 'border-l-4' : 'border-l-4 border-transparent'}`}>
                                  <td className="py-4 px-6 text-sm align-middle font-bold text-slate-700">{actualRankIndex + 1}</td>
                                  <td className="py-4 px-6 text-sm align-middle font-medium text-slate-800">{r.ustaz || "—"}</td>
                                  <td className="py-4 px-6 text-sm align-middle flex items-center gap-3">
                                    {pos !== -1 && <span className="text-2xl drop-shadow-sm">{medal(pos)}</span>}
                                    <span className="font-semibold text-slate-600 uppercase tracking-wide">{r.jamia || "—"}</span>
                                  </td>
                                  <td className={`py-4 px-6 text-sm text-right align-middle ${raqamColor}`}>{formatNumber(r.raqam)}</td>
                                  <td className="py-4 px-6 text-sm text-right align-middle">
                                    <span className="inline-block bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-bold text-xs">
                                      {Number.isFinite(r.unit) ? r.unit.toFixed(1) : "0.0"}
                                    </span>
                                  </td>
                              </tr>
                              );
                          })}
                          {filteredAsatiza.length === 0 && (
                            <tr>
                              <td colSpan="5" className="py-8 text-center text-slate-500">Koi result nahi mila. Dusra naam try karein.</td>
                            </tr>
                          )}
                          </tbody>
                      </table>
                    </div>

                    {/* Mobile View Asatiza */}
                    <div className="md:hidden flex flex-col gap-4">
                    {filteredAsatiza.map((r, idx) => {
                        const actualRankIndex = sortedAsatizaByRaqam.findIndex(item => item.id === r.id);
                        const pos = topAsatizaIds.indexOf(r.id);
                        const tc = topClass(pos);
                        const raqamColor = pos === 0 ? "text-emerald-600 font-bold" : pos === 1 ? "text-sky-600 font-bold" : pos === 2 ? "text-amber-600 font-bold" : "text-slate-800 font-bold";
                        return (
                        <div key={r.id} className={`p-4 rounded-2xl shadow-sm bg-white border ${pos !== -1 ? 'border-l-4' : 'border border-slate-100'} ${tc}`}>
                            <div className="flex items-center justify-between">
                            <div className="flex items-start gap-3">
                                {pos !== -1 && <div className="text-3xl mt-1 drop-shadow-sm">{medal(pos)}</div>}
                                <div>
                                <div className="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">Rank #{actualRankIndex+1}</div>
                                <div className="font-bold text-slate-800 text-lg leading-tight">{r.ustaz || "—"}</div>
                                <div className="text-sm font-medium text-slate-500 mt-1 uppercase">{r.jamia || "—"}</div>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className={`${raqamColor} text-xl mb-1`}>{formatNumber(r.raqam)}</div>
                                <div className="inline-block bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold text-xs">
                                  Unit: {Number.isFinite(r.unit) ? r.unit.toFixed(1) : "0.0"}
                                </div>
                            </div>
                            </div>
                        </div>
                        );
                    })}
                    {filteredAsatiza.length === 0 && (
                      <div className="text-center py-8 text-slate-500 bg-white rounded-2xl border border-slate-100">Koi result nahi mila.</div>
                    )}
                    </div>
                </section>
                ) : (
                
                /* Jamia View */
                <section className="bg-white shadow-sm border border-slate-100 rounded-2xl p-6">
                    <div className="mb-6 flex items-center justify-between border-b border-slate-100 pb-4">
                        <h2 className="text-xl font-bold text-slate-800">Jamia Aggregate Stats</h2>
                        <div className="text-sm font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Top 3 Highlighted</div>
                    </div>
                    <div className="hidden md:grid md:grid-cols-12 gap-8">
                        <div className="col-span-4">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Top Performing</h3>
                        <div className="flex flex-col gap-4">
                            {jamiaData.slice(0, 3).map((j, i) => (
                            <div key={j.id} className={`p-4 rounded-xl border ${topClass(i)}`}>
                                <div className="flex items-start justify-between mb-2">
                                  <div className="flex items-center gap-2">
                                    <div className="text-2xl drop-shadow-sm">{medal(i)}</div>
                                    <div className="text-base font-bold text-slate-800 uppercase leading-tight">{j.jamia}</div>
                                  </div>
                                </div>
                                <div className="flex items-center justify-between bg-white/60 p-2 rounded-lg mt-2">
                                    <div className="text-xs text-slate-500">Total: <span className="font-bold text-slate-800 text-sm">{formatNumber(j.totalAmount)}</span></div>
                                    <div className="text-xs text-slate-500">Asatiza: <span className="font-bold text-slate-800 text-sm">{j.count}</span></div>
                                </div>
                                <div className="mt-2 text-right">
                                  <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">Units: {j.totalUnit.toFixed(2)}</span>
                                </div>
                            </div>
                            ))}
                        </div>
                        </div>
                        <div className="col-span-8">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">All Jamias</h3>
                        <div className="overflow-x-auto rounded-xl border border-slate-100">
                            <table className="min-w-full table-auto border-collapse">
                            <thead className="bg-slate-50 sticky top-0">
                                <tr className="text-left border-b border-slate-200">
                                <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase">Pos</th>
                                <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase">Jamia</th>
                                <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right">Total Amount</th>
                                <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right">Asatiza</th>
                                <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right">Units</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {jamiaData.map((j, i) => (
                                <tr key={j.id} className={`${i < 3 ? "bg-slate-50/50" : ""} hover:bg-slate-50 transition-colors`}>
                                    <td className="py-3 px-4 text-sm font-bold text-slate-500">{i < 3 ? `${medal(i)} ${i + 1}` : (i + 1)}</td>
                                    <td className={`py-3 px-4 text-sm font-bold uppercase ${i === 0 ? "text-amber-700" : i === 1 ? "text-slate-700" : i === 2 ? "text-orange-700" : "text-slate-600"}`}>{j.jamia}</td>
                                    <td className="py-3 px-4 text-sm font-semibold text-slate-800 text-right">{formatNumber(j.totalAmount)}</td>
                                    <td className="py-3 px-4 text-sm font-medium text-slate-600 text-right">{j.count}</td>
                                    <td className="py-3 px-4 text-sm font-bold text-indigo-600 text-right">{j.totalUnit.toFixed(2)}</td>
                                </tr>
                                ))}
                            </tbody>
                            </table>
                        </div>
                        </div>
                    </div>

                    {/* Mobile View Jamia */}
                    <div className="md:hidden flex flex-col gap-4 mt-4">
                        {jamiaData.map((j, i) => {
                        const topHighlightClass = topClass(i);
                        const medalIcon = medal(i);
                        return (
                            <div key={j.id} className={`p-4 rounded-xl shadow-sm bg-white border ${i < 3 ? 'border-l-4' : 'border border-slate-100'} ${topHighlightClass}`}>
                            <div className="flex items-start justify-between">
                                <div className="flex items-center gap-3">
                                {medalIcon && <div className="text-3xl drop-shadow-sm">{medalIcon}</div>}
                                <div>
                                    <div className="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">Rank #{i + 1}</div>
                                    <div className="font-bold text-slate-800 text-base uppercase leading-tight">{j.jamia}</div>
                                </div>
                                </div>
                                <div className="text-right flex-shrink-0">
                                <div className="font-bold text-lg text-emerald-600 mb-1">{formatNumber(j.totalAmount)}</div>
                                <div className="text-xs text-slate-500 font-medium mb-1">Asatiza: <span className="text-slate-800">{j.count}</span></div>
                                <div className="inline-block bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold text-xs">
                                  Units: {j.totalUnit.toFixed(2)}
                                </div>
                                </div>
                            </div>
                            </div>
                        );
                        })}
                    </div>
                </section>
                )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
